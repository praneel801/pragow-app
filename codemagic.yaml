workflows:
  android-workflow:
    name: PRaGoW Android Fixed
    environment:
      flutter: stable
    scripts:
      - name: Fix structure
        script: |
          mkdir -p lib
          if [ -f "main.dart" ]; then cp main.dart lib/main.dart; fi
          if [ ! -d "android" ]; then flutter create --platforms=android --project-name pragow --org com.praneel.pragow .; cp main.dart lib/main.dart || true; fi
          if [ -f "google-services.json" ]; then mkdir -p android/app; cp google-services.json android/app/google-services.json; fi
          # FIX SDK VERSION TO 34
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdk .*/compileSdk 34/' android/app/build.gradle || true
          sed -i 's/compileSdk.*/compileSdk 34/' android/app/build.gradle || true
          grep -q "compileSdk" android/app/build.gradle || echo "android { compileSdk 34 }" >> android/app/build.gradle
      - name: Get packages
        script: flutter pub get
      - name: Build APK only
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
