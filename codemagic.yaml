workflows:
  android-workflow:
    name: PRaGoW Fresh Build
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Clean old android
        script: |
          rm -rf android
          rm -rf build
          rm -rf .dart_tool
      - name: Create fresh project
        script: |
          flutter create --platforms=android --project-name pragow --org com.praneel.pragow --overwrite .
          ls -la
          cat lib/main.dart | head -20
      - name: Restore main file
        script: |
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
            echo "Restored main.dart to lib/main.dart"
          fi
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "Copied google-services.json"
          fi
          cat pubspec.yaml
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons --verbose
    artifacts:
      - build/**/outputs/**/*.apk
