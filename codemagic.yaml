workflows:
  android-workflow:
    name: PRaGoW Final APK
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Save original files
        script: |
          cp main.dart /tmp/main.dart || cp lib/main.dart /tmp/main.dart || true
          cp pubspec.yaml /tmp/pubspec.yaml || true
          cp google-services.json /tmp/google-services.json || true
          ls -la
      - name: Clean and create fresh
        script: |
          rm -rf android ios build .dart_tool
          flutter create --platforms=android --project-name pragow --org com.praneel.pragow --overwrite .
      - name: Restore project files
        script: |
          cp /tmp/main.dart lib/main.dart || cp /tmp/main.dart main.dart || true
          cp /tmp/pubspec.yaml pubspec.yaml || true
          mkdir -p android/app
          cp /tmp/google-services.json android/app/google-services.json || true
          cp google-services.json android/app/google-services.json || true
          echo "=== Restored files ==="
          ls -la lib/
          cat pubspec.yaml
      - name: Get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/*.apk
